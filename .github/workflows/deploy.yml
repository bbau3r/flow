name: Deploy PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push matters, but never cancel a deployment partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build:pwa
        env:
          # Optional, and public by design. Google Drive shows "Needs setup" without them.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
